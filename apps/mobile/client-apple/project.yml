name: Vetta
options:
  bundleIdPrefix: com.flowstoken
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
packages:
  VettaKit:
    path: VettaKit
  VettaRTC:
    path: VettaRTC
targets:
  Vetta:
    type: application
    platform: iOS
    sources:
      - path: Vetta
      - path: Shared
    dependencies:
      - package: VettaKit
      - package: VettaRTC
      - target: VettaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowstoken.mobile
        PRODUCT_NAME: FlowsToken
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Vetta/Resources/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: Vetta/Resources/Info.plist
      properties:
        CFBundleDisplayName: FlowsToken
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape only on the remote desktop page; AppDelegate keeps every other page portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.flowstoken.mobile.pair
            CFBundleURLSchemes:
              - flowstoken
              - vetta
        NSCameraUsageDescription: FlowsToken uses the camera to scan the pairing code on your computer and to take photos you send.
        NSPhotoLibraryUsageDescription: FlowsToken shows your latest photos in the attach sheet so you can send one with a tap.
        NSMicrophoneUsageDescription: FlowsToken uses the microphone while you hold the message field to dictate.
        NSSpeechRecognitionUsageDescription: FlowsToken turns what you say into text for your message.
        NSLocalNetworkUsageDescription: FlowsToken needs local network access to connect directly to your computer on the same Wi-Fi.
        NSBonjourServices:
          - _vetta._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.flowstoken.mobile.refresh
  VettaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VettaWidgets
      - path: Shared
    dependencies:
      - package: VettaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowstoken.mobile.widgets
        PRODUCT_NAME: FlowsTokenWidgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: VettaWidgets/Info.plist
    info:
      path: VettaWidgets/Info.plist
      properties:
        CFBundleDisplayName: FlowsToken
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  VettaRTCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VettaRTC/Tests/VettaRTCTests
    dependencies:
      - package: VettaRTC
      - package: VettaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowstoken.mobile.rtctests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  VettaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VettaUITests
    dependencies:
      - target: Vetta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowstoken.mobile.uitests
        TEST_TARGET_NAME: Vetta
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Vetta:
    build:
      targets:
        Vetta: all
        VettaUITests: [test]
        VettaRTCTests: [test]
    test:
      targets:
        - VettaUITests
        - VettaRTCTests
      gatherCoverageData: false
