name: Set up native SSH test tools
description: Prepare and verify the real runtimes and search tools required by native client tests.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-go@v5
      with:
        go-version-file: apps/ssh-helper/go.mod
        cache-dependency-path: apps/ssh-helper/go.sum
    - name: Install Linux search tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v rg >/dev/null || ! { command -v fd >/dev/null || command -v fdfind >/dev/null; }; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep fd-find
        fi
    - name: Install macOS search tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        command -v rg >/dev/null || brew install ripgrep
        command -v fd >/dev/null || command -v fdfind >/dev/null || brew install fd
    - name: Install Windows ripgrep
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
          choco install ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "ripgrep installation failed" }
        }
    - name: Verify Node version
      shell: bash
      run: node --version
    - name: Verify native POSIX tools
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        test -x /bin/sh
        go version
        rg --version
        fd --version 2>/dev/null || fdfind --version
    - name: Verify Windows test tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        go version
        if ($LASTEXITCODE -ne 0) { throw "Go version probe failed" }
        rg --version
        if ($LASTEXITCODE -ne 0) { throw "ripgrep version probe failed" }
