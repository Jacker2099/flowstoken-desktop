name: mobile-release

# 与桌面 release 配套：桌面流水线发布 GitHub Release 后本流程自动构建手机端产物。
# Android 产出已签名 APK 并直接挂到同一个 Release；iOS archive 后上传 TestFlight
# （需要 App Store Connect 里已存在 com.flowstoken.mobile 的应用记录）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂载手机端产物的 Release tag（如 v0.7.1）"
        required: true
        type: string
      ref:
        description: "构建源码 ref（默认用 tag 本身；仅手机端补发时传发布分支名）"
        required: false
        type: string
  # TestFlight build 90 天过期：每月 1 日自动用最新 Release tag 重传一个新 build 号续期。
  schedule:
    - cron: "35 3 1 * *" # 每月 1 日 11:35 北京

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  BUILD_REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write # gh release upload

jobs:
  # 定时续期没有 event/release 上下文，先解析最新已发布 tag 作为构建源与上传目标。
  prepare:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"

  android-apk:
    name: Android release APK
    if: github.event_name != 'schedule' # 续期只涉及 iOS，APK 无需重发
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile/client-android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize upload keystore
        env:
          ANDROID_KEYSTORE_P12_BASE64: ${{ secrets.ANDROID_KEYSTORE_P12_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_P12_BASE64" | base64 -d > flowstoken-upload.p12
          printf 'storeFile=flowstoken-upload.p12\nstoreType=PKCS12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
          chmod 600 flowstoken-upload.p12 keystore.properties

      - name: Assemble release APK
        run: bash ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          OUT="FlowsToken-${RELEASE_TAG#v}.apk"
          cp "$APK" "$OUT"
          gh release upload "$RELEASE_TAG" "$OUT" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flows-token-android-apk
          path: apps/mobile/client-android/FlowsToken-*.apk
          if-no-files-found: error

  ios-testflight:
    name: iOS archive → TestFlight
    needs: [prepare]
    # prepare 在非 schedule 事件跳过：needs 命中 skipped 不算失败，但 prepare 失败要拦住本 job
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RESOLVED_TAG: ${{ env.RELEASE_TAG || needs.prepare.outputs.tag }}
      RESOLVED_REF: ${{ env.BUILD_REF || needs.prepare.outputs.tag }}
    defaults:
      run:
        working-directory: apps/mobile/client-apple
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_REF }}

      - name: Set up xcodegen
        run: brew install xcodegen

      - name: Materialize signing config and ASC API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID" > Config/Local.xcconfig
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          # build 号用时间戳保证单调递增：同版本重传（续期）和重跑都不会撞上旧 build 号。
          xcodebuild archive \
            -project Vetta.xcodeproj \
            -scheme Vetta \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlowsToken.xcarchive" \
            "CURRENT_PROJECT_VERSION=$(date +%s)" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -quiet

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0">' \
            '<dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>signingStyle</key><string>automatic</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>uploadSymbols</key><true/>' \
            '<key>manageAppVersionAndBuildNumber</key><false/>' \
            '</dict>' \
            '</plist>' > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FlowsToken.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -quiet

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowstoken-ios-ipa
          path: ${{ runner.temp }}/ipa-export/
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/ipa-export"/*.ipa | head -1)
          OUT="FlowsToken-${RESOLVED_TAG#v}.ipa"
          cp "$IPA" "$OUT"
          gh release upload "$RESOLVED_TAG" "$OUT" --clobber

      # ASC 应用记录（com.flowstoken.mobile）必须先在 App Store Connect 网页端建好，
      # 否则本步会报找不到应用——这是 iOS 无法绕过的唯一手工步骤。
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0">' \
            '<dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            '<key>signingStyle</key><string>automatic</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>manageAppVersionAndBuildNumber</key><false/>' \
            '</dict>' \
            '</plist>' > "$RUNNER_TEMP/UploadOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FlowsToken.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-upload" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -quiet

      # 外部测试组里的每个新 build 都需要一次 beta 审核提交，续期上传后自动补交。
      # 脚本内嵌而非引用仓库文件：schedule 续期检出的是旧 Release tag，可能还没有此脚本。
      - name: Submit beta review for the new build
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APP_BUNDLE_ID: com.flowstoken.mobile
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node - <<'EOF'
          const { readFileSync } = require("node:fs");
          const { createSign } = require("node:crypto");
          const { ASC_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID, APP_BUNDLE_ID } = process.env;
          const b64u = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64u({ alg: "ES256", kid: ASC_KEY_ID, typ: "JWT" })}.${b64u({ iss: ASC_ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" })}`;
          const key = readFileSync(ASC_KEY_PATH, "utf8");
          const token = `${unsigned}.${createSign("sha256").update(unsigned).sign({ key, dsaEncoding: "ieee-p1363" }).toString("base64url")}`;
          const api = async (path, method = "GET", body) => {
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: body ? JSON.stringify(body) : undefined,
            });
            return { status: res.status, json: await res.json().catch(() => ({})) };
          };
          (async () => {
            const apps = await api(`/v1/apps?filter[bundleId]=${APP_BUNDLE_ID}`);
            const appId = apps.json.data?.[0]?.id;
            if (!appId) { console.error(`app ${APP_BUNDLE_ID} not found`); process.exit(1); }
            const builds = await api(`/v1/builds?filter[app]=${appId}&sort=-uploadedDate&limit=1`);
            const build = builds.json.data?.[0];
            if (!build) { console.log("build still processing; next keep-alive run will submit"); return; }
            console.log(`build=${build.id} version=${build.attributes.version}`);
            const subs = await api(`/v1/builds/${build.id}/betaAppReviewSubmission`);
            const existing = subs.json.data?.attributes?.betaReviewState;
            if (existing && existing !== "REJECTED") { console.log(`already submitted: ${existing}`); return; }
            const r = await api("/v1/betaAppReviewSubmissions", "POST", {
              data: { type: "betaAppReviewSubmissions", relationships: { build: { data: { type: "builds", id: build.id } } } },
            });
            if (r.status !== 201) { console.error(`submit failed ${r.status}: ${JSON.stringify(r.json.errors || r.json)}`); process.exit(1); }
            console.log("beta review submitted");
          })();
          EOF
