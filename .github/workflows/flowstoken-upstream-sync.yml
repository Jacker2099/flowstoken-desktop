name: flowstoken-upstream-sync

# Daily: when Open Vetta publishes a new release, merge it into main while keeping every FlowsToken
# customization, run the full check set plus the FlowsToken brand guard, and — only if everything
# passes — bump the FlowsToken version and hand over to flowstoken-release, which ships it.
#
# Conflicts are resolved only by scripts/flowstoken/resolve-upstream-conflicts.mjs (fixed rules). Anything
# it refuses, or any failing check, stops the sync: nothing is released, the attempt is pushed to an
# `upstream-sync/<tag>` branch and an issue labelled `upstream-sync` is opened (the FlowsToken server
# forwards it to Telegram).
#
# Secret FT_SYNC_TOKEN (fine-grained PAT, this repo only: Contents + Workflows write) is needed because
# upstream merges usually touch .github/workflows, which GitHub forbids the built-in token to push.

on:
  schedule:
    - cron: "17 2 * * *" # 10:17 Beijing
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to merge (default: latest Open Vetta release)"
        type: string
        required: false
      force:
        description: "Re-run even if this upstream tag was already synced"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: flowstoken-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: openvetta/open-vetta
  MARKER: branding/flowstoken/UPSTREAM_SYNCED

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FT_SYNC_TOKEN || github.token }}

      - name: Detect a new upstream release
        id: detect
        run: |
          TAG="${{ inputs.upstream_tag }}"
          [ -n "$TAG" ] || TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          SYNCED="$(cat "$MARKER" 2>/dev/null || echo none)"
          echo "upstream=${TAG} synced=${SYNCED}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$SYNCED" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.skip != 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: steps.detect.outputs.skip != 'true'
        with:
          bun-version: "1.3.7"

      - name: Merge upstream (FlowsToken-preserving rules)
        id: merge
        if: steps.detect.outputs.skip != 'true'
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          git config user.name "flowstoken-sync[bot]"
          git config user.email "flowstoken-sync@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # Upstream tags live under upstream/* so they never collide with FlowsToken version tags.
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream/${TAG}"
          echo "pre_merge=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git -c merge.conflictStyle=diff3 merge --no-ff --no-commit "upstream/${TAG}"; then
            echo "conflicts=none" >> "$GITHUB_OUTPUT"
          elif node scripts/flowstoken/resolve-upstream-conflicts.mjs > resolve.log 2>&1; then
            cat resolve.log
            echo "conflicts=resolved" >> "$GITHUB_OUTPUT"
          else
            cat resolve.log
            {
              echo "reason=unresolved merge conflicts"
              echo 'detail<<EOF'; cat resolve.log; echo EOF
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 1
          fi
          git commit -q --no-edit -m "chore(upstream): merge Open Vetta ${TAG}"

      - name: Bump FlowsToken version and write release notes
        id: bump
        if: steps.detect.outputs.skip != 'true'
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          VERSION="$(node -e '
            const fs = require("fs"); const p = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            const [a, b, c] = pkg.version.split(".").map(Number); pkg.version = `${a}.${b}.${c + 1}`;
            fs.writeFileSync(p, JSON.stringify(pkg, null, "\t") + "\n"); process.stdout.write(pkg.version);')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${TAG}" > "$MARKER"
          BODY="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}" --jq .body | head -c 6000)"
          {
            echo "# FlowsToken Desktop ${VERSION}"
            echo
            date -u +%Y-%m-%d
            echo
            echo "## 改进"
            echo
            echo "- 同步上游 Open Vetta ${TAG} 的更新（https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG}），FlowsToken 登录、分组预设、品牌与更新通道保持不变。"
            echo
            echo "## 其他"
            echo
            echo "<details><summary>上游 ${TAG} 发布说明</summary>"
            echo
            echo "${BODY}"
            echo
            echo "</details>"
          } > ".github/release-notes/v${VERSION}.md"
          git add apps/desktop/package.json "$MARKER" ".github/release-notes/v${VERSION}.md"

      # Not the shared frozen install: after a merge bun.lock must be refreshed against the merged manifests.
      - name: Refresh workspace dependencies after the merge
        if: steps.detect.outputs.skip != 'true'
        run: bun install

      - name: Install ripgrep (used by upstream tests)
        if: steps.detect.outputs.skip != 'true'
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ripgrep; }

      - name: Checks — upstream release gates + FlowsToken brand guard and related tests
        id: checks
        if: steps.detect.outputs.skip != 'true'
        run: |
          # Gates = what upstream's own desktop-release requires before it ships (check, quality, packaging
          # contracts) + the FlowsToken brand guard + every unit test that depends on a FlowsToken-changed
          # file. Upstream's full affected-unit-test job is not a gate: upstream releases while it is red.
          set -o pipefail
          run() {
            echo "::group::$1"; shift
            set +e; "$@" 2>&1 | tee -a checks-full.log; local rc=${PIPESTATUS[0]}; set -e
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "FAILED: $*" | tee -a checks-failed.log; exit "$rc"; fi
          }
          run "brand guard" node --test branding/flowstoken/tests/brand-guard.test.mjs branding/flowstoken/tests/resolve-upstream-conflicts.test.mjs
          run "release notes" node scripts/release/release-notes.mjs --check
          run "check (lint/types/guards)" bun run check
          run "quality tests" bun run test:quality
          run "desktop packaging contract" bun run verify:desktop:contracts
          run "desktop packaging helpers" bun run test:desktop:packaging
          run "FlowsToken-related unit tests" node scripts/flowstoken/test-flowstoken-related.mjs "upstream/${{ steps.detect.outputs.tag }}"

      - name: Upload check logs
        if: always() && steps.detect.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-checks
          path: |
            checks-full.log
            checks-failed.log
            resolve.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit release bump and push main
        if: steps.detect.outputs.skip != 'true'
        run: |
          git add bun.lock 2>/dev/null || true
          git commit -q -m "chore(desktop): release ${{ steps.bump.outputs.version }} with upstream ${{ steps.detect.outputs.tag }}"
          git push origin HEAD:main

      - name: Ship it
        if: steps.detect.outputs.skip != 'true'
        run: gh workflow run flowstoken-release.yml -R "${{ github.repository }}" --ref main -f reason="upstream ${{ steps.detect.outputs.tag }}"

      - name: Record the failed attempt
        if: failure() && steps.detect.outputs.skip != 'true'
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="upstream-sync/${TAG}"
          if [ "${{ steps.merge.outputs.reason }}" = "" ] && git rev-parse -q --verify HEAD >/dev/null; then
            git add -A >/dev/null 2>&1; git commit -q -m "wip: upstream ${TAG} sync (checks failed)" >/dev/null 2>&1 || true
            git push -f origin "HEAD:refs/heads/${BRANCH}" >/dev/null 2>&1 || true
          fi
          REASON="${{ steps.merge.outputs.reason }}"; [ -n "$REASON" ] || REASON="checks failed"
          # Issues may be disabled on the repository; the FlowsToken server watches failed runs and reports them
          # to Telegram either way, so an issue is a convenience, not the alert path.
          gh label create upstream-sync --color D93F0B --description "Automatic upstream sync needs attention" >/dev/null 2>&1 || true
          BODY="$(printf 'Open Vetta %s could not be synced automatically: **%s**. Nothing was released.\n\nRun: %s\nBranch: %s\n\n```\n%s\n```\n' \
            "$TAG" "$REASON" "$RUN" "$BRANCH" "$( { echo "${{ steps.merge.outputs.detail }}"; cat checks-failed.log 2>/dev/null; grep -E "FAIL |✖|× |error TS|error:" checks-full.log 2>/dev/null | head -40; } | tail -80)")"
          EXISTING="$(gh issue list --label upstream-sync --state open --search "${TAG} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY" || true; else
            gh issue create --title "upstream sync ${TAG} needs attention" --label upstream-sync --body "$BODY" \
              || echo "::warning::could not open an issue (issues disabled?); details are in the run log and artifact"; fi
