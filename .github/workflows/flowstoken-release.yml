name: flowstoken-release

# Builds and publishes a FlowsToken Desktop release for the version in apps/desktop/package.json.
#
# The upstream `desktop-release` workflow does the packaging (quality + all platforms + packaged smoke
# checks) through a non-publishing workflow_dispatch, which also allows unsigned macOS builds while the
# Apple Developer ID is pending. This workflow then publishes the GitHub Release that serves as the
# artifact store: old clients (<= 0.5.61) update from it, and the FlowsToken server mirrors it into
# https://www.flowstoken.com/downloads/desktop, the feed every build from 0.6.0 checks.
#
# Triggered by flowstoken-upstream-sync after a successful merge, or manually for our own changes.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this release (shown in the run name)"
        type: string
        required: false
      reuse_build_run:
        description: "Retry only: publish from an existing desktop-release run (must have built the commit the version tag points to)"
        type: string
        required: false

run-name: "flowstoken-release ${{ github.ref_name }} ${{ inputs.reason }}"

permissions:
  contents: write
  actions: write

concurrency:
  group: flowstoken-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: v
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::Release v${VERSION} is already published; bump apps/desktop/package.json first."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: FlowsToken brand guard + release notes
        run: |
          node --test branding/flowstoken/tests/*.test.mjs
          node scripts/release/release-notes.mjs --check

      - name: Tag the release commit
        if: inputs.reuse_build_run == ''
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          REMOTE="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [ -n "$REMOTE" ] && [ "$REMOTE" != "${GITHUB_SHA}" ]; then
            # Left over from an attempt that never published (published releases were refused above).
            echo "::warning::moving unpublished tag ${TAG} from ${REMOTE} to ${GITHUB_SHA}"
            git push origin ":refs/tags/${TAG}"
            REMOTE=""
          fi
          if [ -z "$REMOTE" ]; then
            git tag "${TAG}" "${GITHUB_SHA}"
            # GITHUB_TOKEN pushes do not trigger workflows, so the upstream tag-push release does not fire.
            git push origin "refs/tags/${TAG}"
          fi

      - name: Build all platforms (upstream desktop-release, non-publishing)
        id: build
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ -n "${{ inputs.reuse_build_run }}" ]; then
            RUN_ID="${{ inputs.reuse_build_run }}"
            BUILT="$(gh run view "$RUN_ID" -R "$REPO" --json headSha --jq .headSha)"
            TAGGED="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" "refs/tags/${TAG}" | tail -1 | cut -f1)"
            test -n "$TAGGED" && test "$BUILT" = "$TAGGED" || { echo "::error::run ${RUN_ID} built ${BUILT}, ${TAG} is ${TAGGED}"; exit 1; }
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "Reusing https://github.com/${REPO}/actions/runs/${RUN_ID} (built ${BUILT})"
          else
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run desktop-release.yml -R "$REPO" --ref "${TAG}" \
            -f release_target=github -f channel=default -f notes="flowstoken ${TAG}"
          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list -R "$REPO" --workflow desktop-release.yml --event workflow_dispatch --json databaseId,headBranch,createdAt \
              --jq "map(select(.headBranch==\"${TAG}\" and .createdAt >= \"${SINCE}\")) | .[0].databaseId // empty")"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          test -n "$RUN_ID" || { echo "::error::desktop-release run did not start"; exit 1; }
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for https://github.com/${REPO}/actions/runs/${RUN_ID}"
          gh run watch "$RUN_ID" -R "$REPO" --interval 60 > /dev/null || true
          fi
          # Gate on upstream's quality job and all four platform builds. Upstream's post-build "verify" jobs
          # hard-code Vetta install paths (/opt/Vetta/Vetta) and (in v0.5.59) break on Windows paths, so they
          # are reported, not gating; FlowsToken runs its own package verification below.
          gh run view "$RUN_ID" -R "$REPO" --json jobs --jq '.jobs[] | "\(.name)\t\(.conclusion)"' | tee jobs.tsv
          for job in "validate and test Desktop release" "build linux" "build windows" "build macos-arm64" "build macos-x64"; do
            grep -qP "^${job}\tsuccess$" jobs.tsv || { echo "::error::upstream job '${job}' did not succeed"; exit 1; }
          done
          grep -P "^verify " jobs.tsv | grep -vP "\tsuccess$" | while IFS=$'\t' read -r name result; do
            echo "::warning::upstream ${name} = ${result} (not a FlowsToken gate)"
          done

      - name: Collect build artifacts (from the build checkpoints)
        run: |
          mkdir -p ckpt apps/desktop/release
          for platform in linux windows macos-arm64 macos-x64; do
            gh run download "${{ steps.build.outputs.run_id }}" -R "$REPO" -n "release-build-${platform}" -D "ckpt/${platform}"
            mkdir -p "ckpt/${platform}/x" && tar -xf "ckpt/${platform}/release-build.tar" -C "ckpt/${platform}/x"
            src="ckpt/${platform}/x/release"
            # Both macOS builds emit latest-mac.yml; name them per arch for merge:updates:mac.
            case "$platform" in
              macos-arm64) mv "$src/latest-mac.yml" "$src/latest-mac-arm64.yml" ;;
              macos-x64) mv "$src/latest-mac.yml" "$src/latest-mac-x64.yml" ;;
            esac
            find "$src" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.blockmap' -o -name '*.deb' -o -name '*.dmg' \
              -o -name '*.exe' -o -name '*.msi' -o -name '*.rpm' -o -name '*.zip' -o -name 'latest*.yml' \) \
              -exec mv -f {} apps/desktop/release/ \;
          done
          rm -rf ckpt
          ls -la apps/desktop/release

      - name: Verify Linux packages (FlowsToken install paths)
        working-directory: apps/desktop
        env:
          VETTA_PRODUCT_NAME: FlowsToken
          VETTA_EXECUTABLE_NAME: FlowsToken
        run: |
          sudo apt-get update -q && sudo apt-get install --no-install-recommends -y rpm >/dev/null
          node scripts/verify-linux-update.mjs --release
          node scripts/verify-linux-packages.mjs
          docker run --rm --volume "${PWD}/release:/release:ro" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -q >/dev/null && apt-get install --yes /release/*.deb >/dev/null
            test -x /opt/FlowsToken/FlowsToken && test -f /opt/FlowsToken/resources/package-type'

      - name: Merge macOS update metadata
        working-directory: apps/desktop
        run: bun run merge:updates:mac

      - name: Verify every feed entry is present
        working-directory: apps/desktop/release
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          for y in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "$y" || { echo "::error::missing $y"; exit 1; }
            grep -q "^version: ${VERSION}$" "$y" || { echo "::error::$y is not ${VERSION}"; exit 1; }
            for f in $(grep -oE 'url: .+' "$y" | cut -d' ' -f2); do
              test -f "$f" || { echo "::error::$y references missing $f"; exit 1; }
            done
          done

      - name: Publish GitHub Release
        run: |
          TAG="${{ steps.v.outputs.tag }}"; VERSION="${{ steps.v.outputs.version }}"
          NOTES="$(node scripts/release/release-notes.mjs --version "${VERSION}")"
          if ! gh release view "${TAG}" -R "$REPO" >/dev/null 2>&1; then
            gh release create "${TAG}" -R "$REPO" --draft --verify-tag --title "FlowsToken Desktop ${VERSION}" --notes-file "${NOTES}"
          fi
          find apps/desktop/release -maxdepth 1 -type f -print0 | xargs -0 gh release upload "${TAG}" -R "$REPO" --clobber
          gh release edit "${TAG}" -R "$REPO" --draft=false --latest

      - name: Verify the published feed (what installed <= 0.5.61 clients read)
        run: |
          TAG="${{ steps.v.outputs.tag }}"; VERSION="${{ steps.v.outputs.version }}"
          for y in latest.yml latest-mac.yml latest-linux.yml; do
            curl -fsSL "https://github.com/${REPO}/releases/download/${TAG}/${y}" | grep -q "^version: ${VERSION}$"
          done
          echo "Published ${TAG}; the FlowsToken server mirrors it within 10 minutes."
