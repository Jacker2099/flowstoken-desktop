name: flowstoken-release

# Builds and publishes a FlowsToken Desktop release for the version in apps/desktop/package.json.
#
# The upstream `desktop-release` workflow does the packaging (quality + all platforms + packaged smoke
# checks) through a non-publishing workflow_dispatch. macOS builds are signed with the FlowsToken Developer ID
# and notarized there (MACOS_CERTIFICATE_* / APPLE_* secrets); the dispatch itself would still accept an
# unsigned build, so the collect step below refuses to publish one. This workflow then publishes the GitHub Release that serves as the
# artifact store: old clients (<= 0.5.61) update from it, and the FlowsToken server mirrors it into
# https://www.flowstoken.com/downloads/desktop, the feed every build from 0.6.0 checks.
#
# Triggered by flowstoken-upstream-sync after a successful merge, or manually for our own changes.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this release (shown in the run name)"
        type: string
        required: false
      expected_sha:
        description: "Optional exact commit required by upstream sync"
        type: string
        required: false
      reuse_build_run:
        description: "Retry only: publish from an existing desktop-release run (must have built this workflow commit and passed every build and verification gate)"
        type: string
        required: false

run-name: "flowstoken-release ${{ github.ref_name }} ${{ inputs.reason }}"

permissions:
  contents: write
  actions: write

concurrency:
  group: flowstoken-release
  cancel-in-progress: false

jobs:
  validate-related:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Verify FlowsToken-related client tests
        run: |
          UPSTREAM_TAG="$(tr -d '\r\n' < branding/flowstoken/UPSTREAM_SYNCED)"
          [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid upstream marker" >&2; exit 1; }
          git fetch --no-tags https://github.com/openvetta/open-vetta.git "refs/tags/${UPSTREAM_TAG}:refs/tags/upstream/${UPSTREAM_TAG}"
          node scripts/flowstoken/test-flowstoken-related.mjs "upstream/${UPSTREAM_TAG}"

  build:
    needs: validate-related
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      run_id: ${{ steps.build.outputs.run_id }}
      attempt: ${{ steps.build.outputs.build_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: v
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo "::error::main changed after upstream sync; refusing a different commit"; exit 1; }
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          node scripts/flowstoken/publish-release.mjs --check --repo "$REPO" --version "$VERSION"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: FlowsToken brand guard + release notes
        run: |
          node --test branding/flowstoken/tests/*.test.mjs
          node scripts/release/release-notes.mjs --check

      - name: Tag the release commit
        if: inputs.reuse_build_run == ''
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          REMOTE="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [ -n "$REMOTE" ] && [ "$REMOTE" != "${GITHUB_SHA}" ]; then
            echo "::error::${TAG} already points to another commit; resolve the unpublished tag explicitly or bump the version."
            exit 1
          fi
          if [ -z "$REMOTE" ]; then
            git tag -f "${TAG}" "${GITHUB_SHA}"  # checkout may already hold the stale local tag
            # GITHUB_TOKEN pushes do not trigger workflows, so the upstream tag-push release does not fire.
            git push origin "refs/tags/${TAG}"
          fi

      - name: Build all platforms (upstream desktop-release, non-publishing)
        id: build
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ -n "${{ inputs.reuse_build_run }}" ]; then
            RUN_ID="${{ inputs.reuse_build_run }}"
          else
            SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run desktop-release.yml -R "$REPO" --ref "${TAG}" \
              -f release_target=github -f channel=default -f notes="flowstoken ${TAG}"
            RUN_ID=""
            for _ in $(seq 1 60); do
              RUN_ID="$(gh run list -R "$REPO" --workflow desktop-release.yml --event workflow_dispatch --json databaseId,headBranch,createdAt \
                --jq "map(select(.headBranch==\"${TAG}\" and .createdAt >= \"${SINCE}\")) | .[0].databaseId // empty")"
              [ -n "$RUN_ID" ] && break
              sleep 10
            done
            test -n "$RUN_ID" || { echo "::error::desktop-release run did not start"; exit 1; }
          fi
          # Reuse only this workflow commit: older runs may not contain the required release gates.
          TAGGED="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" "refs/tags/${TAG}" | tail -1 | cut -f1)"
          test "$TAGGED" = "$GITHUB_SHA" || { echo "::error::${TAG} does not point to this workflow commit"; exit 1; }
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          # Require quality, all four builds and all four verification jobs, including packaged E2E.
          node scripts/flowstoken/wait-release-builds.mjs --repo "$REPO" --run "$RUN_ID" --sha "$GITHUB_SHA"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Check build identity before downloading
        run: node scripts/flowstoken/wait-release-builds.mjs --repo "$REPO" --run "${{ needs.build.outputs.run_id }}" --sha "$GITHUB_SHA" --attempt "${{ needs.build.outputs.attempt }}" --check

      - name: Collect build artifacts (from the build checkpoints)
        run: |
          mkdir -p ckpt apps/desktop/release
          for platform in linux windows macos-arm64 macos-x64; do
            gh run download "${{ needs.build.outputs.run_id }}" -R "$REPO" -n "release-build-${platform}" -D "ckpt/${platform}"
            mkdir -p "ckpt/${platform}/x" && tar -xf "ckpt/${platform}/release-build.tar" -C "ckpt/${platform}/x"
            src="ckpt/${platform}/x/release"
            [ "$(cat "$src/release-publish.txt" 2>/dev/null)" = "false" ] || {
              echo "::error::${platform} checkpoint did not come from a non-publishing dispatch"; exit 1; }
            node scripts/flowstoken/release-artifacts.mjs --mode check-checkpoint --dir "$src" --version "${{ needs.build.outputs.version }}" --sha "$GITHUB_SHA" --run "${{ needs.build.outputs.run_id }}" --attempt "${{ needs.build.outputs.attempt }}" --platform "$platform"
            # 1 = the build ran with signing credentials; with them a signing or notarization failure fails the
            # build before its checkpoint exists, so only a signed and notarized macOS build carries a 1.
            case "$platform" in
              macos-*) [ "$(cat "$src/require-mac-signature.txt" 2>/dev/null)" = "1" ] || {
                echo "::error::${platform} build is not signed and notarized; check the MACOS_CERTIFICATE_* / APPLE_* secrets"; exit 1; } ;;
            esac
            # Both macOS builds emit latest-mac.yml; name them per arch for merge:updates:mac.
            case "$platform" in
              macos-arm64) mv "$src/latest-mac.yml" "$src/latest-mac-arm64.yml" ;;
              macos-x64) mv "$src/latest-mac.yml" "$src/latest-mac-x64.yml" ;;
            esac
            find "$src" -maxdepth 1 -type f ! -name '._*' ! -name 'default._*' \( -name '*.AppImage' -o -name '*.blockmap' -o -name '*.deb' -o -name '*.dmg' \
              -o -name '*.exe' -o -name '*.msi' -o -name '*.rpm' -o -name '*.zip' -o -name 'latest*.yml' \) \
              -exec mv -f {} apps/desktop/release/ \;
          done
          rm -rf ckpt
          ls -la apps/desktop/release

      - name: Verify Linux packages (FlowsToken install paths)
        working-directory: apps/desktop
        env:
          VETTA_PRODUCT_NAME: FlowsToken
          VETTA_EXECUTABLE_NAME: FlowsToken
        run: |
          sudo apt-get update -q && sudo apt-get install --no-install-recommends -y rpm >/dev/null
          node scripts/verify-linux-update.mjs --release
          node scripts/verify-linux-packages.mjs
          docker run --rm --volume "${PWD}/release:/release:ro" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -q >/dev/null && apt-get install --yes /release/*.deb >/dev/null
            test -x /opt/FlowsToken/FlowsToken && test -f /opt/FlowsToken/resources/package-type'

      - name: Merge macOS update metadata
        working-directory: apps/desktop
        run: bun run merge:updates:mac

      - name: Verify every feed entry is present
        run: node scripts/flowstoken/release-artifacts.mjs --mode release --dir apps/desktop/release --version "${{ needs.build.outputs.version }}" --sha "$GITHUB_SHA" --run "${{ needs.build.outputs.run_id }}" --attempt "${{ needs.build.outputs.attempt }}"

      - name: Check build identity after downloading
        run: node scripts/flowstoken/wait-release-builds.mjs --repo "$REPO" --run "${{ needs.build.outputs.run_id }}" --sha "$GITHUB_SHA" --attempt "${{ needs.build.outputs.attempt }}" --check

      - name: Publish GitHub Release
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NOTES="$(node scripts/release/release-notes.mjs --version "$VERSION")"
          node scripts/flowstoken/publish-release.mjs --repo "$REPO" --version "$VERSION" --sha "$GITHUB_SHA" --dir apps/desktop/release --notes "$NOTES"

      - name: Verify the published feed (what installed <= 0.5.61 clients read)
        run: |
          TAG="${{ needs.build.outputs.tag }}"; VERSION="${{ needs.build.outputs.version }}"
          for y in latest.yml latest-mac.yml latest-linux.yml; do
            curl -fsSL "https://github.com/${REPO}/releases/download/${TAG}/${y}" | grep -q "^version: ${VERSION}$"
          done
          echo "Published ${TAG}; the FlowsToken server mirrors it within 10 minutes."
