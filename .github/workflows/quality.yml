name: Windows lifecycle diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Build real desktop test dependencies
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {buildableTestDependencies, runBun} from './scripts/quality/lib.mjs';
          process.exit(runBun(['x','turbo','run','build',...buildableTestDependencies(['desktop']).map(name=>`--filter=${name}`)]));
          JS
      - name: Diagnose owned Windows process and resource lifecycle
        working-directory: apps/desktop
        env:
          VETTA_LOOPBACK_TRACE: "1"
        run: bun ../../scripts/quality/run-vitest.mjs --run src/main/ssh/loopback-fixture.test.ts src/main/plugins/command-spawner.remote.test.ts src/main/agent-runtime/resource-runtime.remote.test.ts --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-lifecycle-trace
          path: apps/desktop/diagnostics/*.json
          if-no-files-found: ignore
