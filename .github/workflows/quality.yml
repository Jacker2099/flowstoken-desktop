name: Windows resource and catalog diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install native test prerequisites
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep --yes --no-progress }
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/ssh-helper/go.mod
          cache-dependency-path: apps/ssh-helper/go.sum
      - name: Verify native Go
        run: go version
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Build real desktop test dependencies
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {buildableTestDependencies, runBun} from './scripts/quality/lib.mjs';
          process.exit(runBun(['x','turbo','run','build',...buildableTestDependencies(['desktop']).map(name=>`--filter=${name}`)]));
          JS
      - name: Verify resource reads and catalog isolation
        working-directory: apps/desktop
        env:
          VETTA_LOOPBACK_TRACE: "1"
        run: bun ../../scripts/quality/run-vitest.mjs --run src/main/agent-runtime/remote-resource-read-scope.test.ts src/main/agent-runtime/resource-runtime.remote.test.ts src/main/plugins/command-spawner.remote.test.ts src/main/ssh/loopback-fixture.test.ts src/main/flowstoken/account-service.tokens.test.ts --reporter=verbose
      - name: Verify complete native Windows SSH matrix
        run: bun scripts/flowstoken/test-ssh-platform.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-resource-catalog-diagnostics
          path: apps/desktop/diagnostics/*.json
          if-no-files-found: ignore
